<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-3">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registro - Colégio Alfredo Chaves</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Colégio Cívico Militar Alfredo Chaves</h1>
    </header>

    <main>

        <div class="caixa">

            <h2>Registro de Acesso</h2>

            <label for="email">E-mail:</label>

            <input
                type="email"
                id="email"
                placeholder="Digite seu e-mail"
            >

            <label for="serie">Série/Ano:</label>

            <select id="serie">
                <option value="">Selecione sua série</option>
                <option value="6">6º Ano</option>
                <option value="7">7º Ano</option>
                <option value="8">8º Ano</option>
                <option value="9">9º Ano</option>
                <option value="1">1º Ano</option>
                <option value="2">2º Ano</option>
                <option value="3">3º Ano</option>
            </select>

            <label for="turma">Turma:</label>

            <select id="turma">
                <option value="">Selecione sua turma</option>
                <option value="A">A</option>
                <option value="B">B</option>
                <option value="C">C</option>
                <option value="D">D</option>
                <option value="E">E</option>
            </select>

            <label for="equipamento">Número do equipamento:</label>

            <input
                type="number"
                id="equipamento"
                placeholder="Digite o número do equipamento"
            >

            <p>
                Horário atual:
                <span id="horario">00:00</span>
            </p>

            <button onclick="registrar()">REGISTRAR</button>

        </div>

    </main>


    <script>

        // ==========================
        // HORÁRIO
        // ==========================

        function atualizarHorario() {

            const agora = new Date();

            let horas = agora.getHours();
            let minutos = agora.getMinutes();

            horas = horas.toString().padStart(2, "0");
            minutos = minutos.toString().padStart(2, "0");

            document.getElementById("horario").textContent =
                horas + ":" + minutos;
        }

        setInterval(atualizarHorario, 1000);

        atualizarHorario();


        // ==========================
        // REGISTRO
        // ==========================

        async function registrar() {

            const email = document.getElementById("email").value;
            const serie = document.getElementById("serie").value;
            const turma = document.getElementById("turma").value;
            const equipamento = document.getElementById("equipamento").value;
            const horario = document.getElementById("horario").textContent;


            // CONSOLE PARA TESTAR OS DADOS

            console.log("========== REGISTRO ==========");
            console.log("E-mail:", email);
            console.log("Série:", serie);
            console.log("Turma:", turma);
            console.log("Equipamento:", equipamento);
            console.log("Horário:", horario);
            console.log("==============================");


            // VERIFICAÇÃO DOS CAMPOS

            if (
                email === "" ||
                serie === "" ||
                turma === "" ||
                equipamento === ""
            ) {

                alert("Preencha todos os campos antes de registrar.");

                return;
            }


            // ENVIA OS DADOS PARA O PYTHON

            const resposta = await fetch("/registrar", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({

                    email: email,
                    serie: serie,
                    turma: turma,
                    equipamento: equipamento,
                    horario: horario

                })

            });


            const resultado = await resposta.json();


            console.log("Resposta do servidor:", resultado);


            if (resultado.sucesso) {

                alert("Registro realizado com sucesso!");

                window.location.href = "https://www.google.com";

            } else {

                alert("Erro ao realizar o registro.");

            }

        }

    </script>

</body>

</html>
